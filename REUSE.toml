version = 1
SPDX-PackageName = "qMetronome"
SPDX-PackageSupplier = "Quaternion Media"
SPDX-PackageDownloadLocation = "https://github.com/quaternionmedia/qmetronome"

# Licensing is declared here, not as a header in each file. Paths are matched
# by the last block that matches, so the blocks below the default win over it.
# readme/license.md is the page a person reads; this file is what `reuse lint`
# reads.

# --- The app: source, resources, build scripts, tooling ---------------------
# The additional permission lets the app be combined with Nothing Technology
# Limited's Glyph Matrix SDK, which the build fetches and this repository does
# not hold. Its text is LICENSES/GPL-3.0-linking-exception.txt.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 Quaternion Media"
SPDX-License-Identifier = "GPL-3.0-or-later WITH GPL-3.0-linking-exception"

# --- Prose and its pictures --------------------------------------------------
[[annotations]]
path = [
  "README.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "PRIVACY.md",
  "docs/**",
  "readme/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Quaternion Media"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# --- Copied from the QM constitution's project seed: instruction files -------
[[annotations]]
path = [
  "AGENTS.md",
  "CLAUDE.md",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Quaternion Media"
SPDX-License-Identifier = "CC0-1.0"

# --- Copied from the QM constitution's project seed: workflows and editor ----
# The seed's workflows by name. A workflow that is this project's own stays
# under the default above.
[[annotations]]
path = [
  ".vscode/**",
  ".github/workflows/adr-lint.yml",
  ".github/workflows/leak-check.yml",
  ".github/workflows/one-pr-check.yml",
  ".github/workflows/reuse-lint.yml",
  ".github/workflows/signature-check.yml",
  ".github/workflows/submodule-check.yml",
  ".github/workflows/tag-claims.yml",
  ".github/workflows/timeless-check.yml",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Quaternion Media"
SPDX-License-Identifier = "Apache-2.0"

# --- The Gradle wrapper -------------------------------------------------------
# Generated by Gradle and carried unchanged. `gradlew` and `gradlew.bat` state
# this licence in their own headers.
[[annotations]]
path = [
  "gradlew",
  "gradlew.bat",
  "gradle/wrapper/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2015 the original authors"
SPDX-License-Identifier = "Apache-2.0"
